7"/><text x="819.7" y="662" font-size="10" text-anchor="start" fill="#fff" font-weight="bold">numbers later</text><text x="770" y="120" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">The boss arrives as an enemy</text><text x="770" y="135" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">reinforcement on a later turn,</text><text x="770" y="150" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">walks 1 square a turn and pushes</text><text x="770" y="165" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">whatever is in front of it;</text><text x="770" y="180" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">its shoulder goblin dies with it.</text><text x="20" y="702" font-size="11" text-anchor="start" fill="#1B1410" font-weight="normal">All three enemy types share one goblin head, so one goblin reference image can carry across them. Type is read from the weapon or mount.</text><text x="20" y="720" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">Design sketch by Claude Code (SVG) under Jiean Yin's direction — not generated art.</text></svg>