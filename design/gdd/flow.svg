<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="480" fill="#F4EFE4"/><text x="20" y="30" font-size="16" text-anchor="start" fill="#1B1410" font-weight="bold">Game flow — the full game; teal boxes exist in the built slice</text><rect x="20" y="50" width="150" height="64" rx="8" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="95.0" y="72" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Title</text><text x="95.0" y="90" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">press Enter</text><rect x="210" y="50" width="200" height="64" rx="8" fill="#fff" stroke="#8a8073" stroke-width="2" stroke-dasharray="7 5"/><text x="310.0" y="72" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Episode &amp; level select</text><text x="310.0" y="90" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">unlocked levels</text><rect x="450" y="50" width="220" height="64" rx="8" fill="#fff" stroke="#8a8073" stroke-width="2" stroke-dasharray="7 5"/><text x="560.0" y="72" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Briefing</text><text x="560.0" y="90" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">story text, board, terrain,</text><text x="560.0" y="105" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">enemy army</text><rect x="710" y="50" width="270" height="64" rx="8" fill="#fff" stroke="#8a8073" stroke-width="2" stroke-dasharray="7 5"/><text x="845.0" y="72" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Army draft</text><text x="845.0" y="90" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">split the pool into archers,</text><text x="845.0" y="105" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">riders and shielders</text><line x1="172" y1="82" x2="208" y2="82" stroke="#1B1410" stroke-width="3"/><path d="M 208,82 L 199.8959760788259,85.91468980700107 L 199.8959760788259,78.08531019299893 z" fill="#1B1410"/><line x1="412" y1="82" x2="448" y2="82" stroke="#1B1410" stroke-width="3"/><path d="M 448,82 L 439.8959760788259,85.91468980700107 L 439.8959760788259,78.08531019299893 z" fill="#1B1410"/><line x1="672" y1="82" x2="708" y2="82" stroke="#1B1410" stroke-width="3"/><path d="M 708,82 L 699.8959760788259,85.91468980700107 L 699.8959760788259,78.08531019299893 z" fill="#1B1410"/><rect x="120" y="160" width="760" height="120" rx="8" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="500.0" y="182" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Turn loop (both sides plan at once)</text><text x="150" y="210" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">1 Reinforce: place new soldiers</text><text x="150" y="227" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">2 Plan moves (+ Mend)</text><text x="150" y="244" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">3 Riders' first step</text><text x="150" y="261" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">4 Main move</text><text x="450" y="210" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">5 Plan attacks</text><text x="450" y="227" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">6 Combat, one unit at a time</text><text x="450" y="244" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">7 Contested moves; Mend heals land</text><text x="450" y="261" font-size="12" text-anchor="start" fill="#1B1410" font-weight="normal">8 Win check: no winner → next turn</text><text x="860" y="272" font-size="10" text-anchor="end" fill="#6b6257" font-weight="normal">slice: archers only, steps 2, 4, 5, 6, 8</text><line x1="780" y1="114" x2="780" y2="158" stroke="#1B1410" stroke-width="3"/><path d="M 780,158 L 776.0853101929989,149.8959760788259 L 783.9146898070011,149.8959760788259 z" fill="#1B1410"/><rect x="120" y="330" width="170" height="64" rx="8" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="205.0" y="352" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Victory</text><text x="205.0" y="370" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">back row reached,</text><text x="205.0" y="385" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">or the enemy is gone</text><rect x="340" y="330" width="220" height="64" rx="8" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="450.0" y="352" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Results</text><text x="450.0" y="370" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">turns, hits, retries;</text><text x="450.0" y="385" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">Enter: next level</text><rect x="600" y="330" width="170" height="64" rx="8" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="685.0" y="352" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Defeat</text><text x="685.0" y="370" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">the card names the cause</text><rect x="810" y="330" width="170" height="64" rx="8" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="895.0" y="352" font-size="14" text-anchor="middle" fill="#1B1410" font-weight="bold">Retry (R)</text><text x="895.0" y="370" font-size="11" text-anchor="middle" fill="#1B1410" font-weight="normal">same level, same draft</text><line x1="205" y1="280" x2="205" y2="328" stroke="#1B1410" stroke-width="3"/><path d="M 205,328 L 201.08531019299892,319.8959760788259 L 208.91468980700108,319.8959760788259 z" fill="#1B1410"/><line x1="685" y1="280" x2="685" y2="328" stroke="#1B1410" stroke-width="3"/><path d="M 685,328 L 681.0853101929989,319.8959760788259 L 688.9146898070011,319.8959760788259 z" fill="#1B1410"/><line x1="290" y1="362" x2="338" y2="362" stroke="#1B1410" stroke-width="3"/><path d="M 338,362 L 329.8959760788259,365.9146898070011 L 329.8959760788259,358.0853101929989 z" fill="#1B1410"/><line x1="770" y1="362" x2="808" y2="362" stroke="#1B1410" stroke-width="3"/><path d="M 808,362 L 799.8959760788259,365.9146898070011 L 799.8959760788259,358.0853101929989 z" fill="#1B1410"/><line x1="860" y1="330" x2="860" y2="282" stroke="#1B1410" stroke-width="3"/><path d="M 860,282 L 863.9146898070011,290.1040239211741 L 856.0853101929989,290.1040239211741 z" fill="#1B1410"/><path d="M 450,394 L 450,412 L 40,412 L 40,138 L 300,138" fill="none" stroke="#1B1410" stroke-width="3" stroke-dasharray="7 5"/><line x1="300" y1="138" x2="300" y2="116" stroke="#1B1410" stroke-width="3"/><path d="M 300,116 L 303.9146898070011,124.10402392117409 L 296.0853101929989,124.10402392117409 z" fill="#1B1410"/><text x="60" y="406" font-size="11" text-anchor="start" fill="#1B1410" font-weight="normal">next level unlocks</text><rect x="20" y="430" width="22" height="14" rx="3" fill="#fff" stroke="#1F6F78" stroke-width="3"/><text x="50" y="442" font-size="11" text-anchor="start" fill="#1B1410" font-weight="normal">in the built slice</text><rect x="170" y="430" width="22" height="14" rx="3" fill="#fff" stroke="#8a8073" stroke-width="2" stroke-dasharray="5 3"/><text x="200" y="442" font-size="11" text-anchor="start" fill="#1B1410" font-weight="normal">planned</text><text x="280" y="442" font-size="11" text-anchor="start" fill="#1B1410" font-weight="normal">P / Esc pauses from any play state; M and N mute music and sound.</text><text x="20" y="470" font-size="11" text-anchor="start" fill="#6b6257" font-weight="normal">Design sketch by Claude Code (SVG) under Jiean Yin's direction — not generated art.</text></svg>